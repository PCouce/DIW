<!DOCTYPE html> <!-- Indica al navegador que se trata de una página web -->
<html lang="es">  <!-- Elemento raíz de la página web. Artibuto lang: estable el idioma principal del documento -->

<head> <!-- Zona de metainformación -->
    <meta charset="UTF-8"> <!-- codificación de caracteres-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta el contenido al tamaño de la pantalla del dis-
                                                                                dispositivo. Se utiliza para controlar cómo se visua-
                                                                                liza y escala una  una página en dispositivos con pan-
                                                                                tallas de distintos tamaños-->            
                                                                               
    <title>Ejemplo estructura mínima</title> <!-- Título de la página -->
</head>
<body> <!-- Parte visible. Todo lo que coloquemos dentro de esta etiqueta se visualizará en el navegador -->
    
</body>
</html>
