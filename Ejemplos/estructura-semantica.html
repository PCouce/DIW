<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de estructura semántica</title>
</head>
<body>

    <!-- Cabecera global de la página web-->
    <header> 
        <h1>Cabecera</h1>
        <!-- Menú de navegación principal -->
         <nav>
            <!-- Enlaces del menú de navegación-->
         </nav>

    </header>
    
    <!-- Contenido principal-->
    <main>
        <section id="inicio">

        </section>

        <section id="contenido">
            <!-- Agrupa un contenido independiente de la página que podría ser extraído de la misma
                sin que se perdiera su significado.
                
                Puede estar subdividido en mas partes:
                    - Cabecera <header>
                    - Cuerpo <section>
                    - Pie de artículo <footer-->
            <article>
                <!-- Agrupa una imagen con su explicación-->
                <figure>
                    <img src="" alt="">
                    <figcaption></figcaption>
                </figure>

            </article>
        </section>

        <!-- Contenido secundario de menor importancia o complementario al contenido princiapl.
             Define la barra lateral de la página web -->
        <aside>

        </aside>
    </main>

    <!-- Representa el pie o parte final de un página, de una sección o de un artículo-->
    <footer>

    </footer>
    
</body>
</html>
