<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo imágenes</title>
</head>
<body>
    
    <!-- Imagen cargada desde un servidor --> 
    <img src="https://images.unsplash.com/photo-1787669425336-10233aefab08?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
    alt="Imagen ola" width="450" height="600">

    <!--Imagen cargada desde un archivo local-->
    <img src="./img/arboles.jpg"
    alt="Imagen de árboles" width="450" height="600">

    <br>

    <!-- Para enmarcar una foto en un documento se utiliza el elemento <figure>, junto con <figcaption>
        para darle un subtitulo-->

    <h1> Ejemplo con figure y figcaption</h1>
    <figure>
        <img src="./img/puente-de-Rande-1280x719.jpg"
        alt="Puente de Rande" style="width:100%">
        <figcaption>Fig.1 - Puente de Rande, Vigo, Galicia</figcaption>
    </figure>
    
</body>
</html>
