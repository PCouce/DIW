<!DOCTYPE html> <!-- Indica al navegador que se trata de una página web -->
<html lang="es">  <!-- Elemento raíz de la página web. Artibuto lang: estable el idioma principal del documento -->

<head> <!-- Zona de metainformación -->
    <meta charset="UTF-8"> <!-- codificación de caracteres-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta el contenido al tamaño de la pantalla del dis-
                                                                                dispositivo. Se utiliza para controlar cómo se visua-
                                                                                liza y escala una  una página en dispositivos con pan-
                                                                                tallas de distintos tamaños-->            
                                                                               
    <title>Ejemplo estructura mínima</title> <!-- Título de la página, se visualiza en la ventana/pestaña -->
    <meta name="description" content="Ejemplo y descripción de los metadatos de una página web">
    <meta name="robots" content="index, follow"> <!-- Le indica al Googlebot si tiene que indexaar la página y/o
                                                 seguir los enlaces-->
    <meta name="theme-color" content="#ff0066"> <!-- Indica al navegador el color principal o corporativo de tu página
                                                web. Según el navegador o sistema operativo cambia el color de la barra
                                                de direcciones o herramientas del navegador  -->

    <link rel="icon" type="image/jpg" href="./img/LogoDepartamentoWeb.png"> <!-- Enlaza a una  imagen que se visualizará
                                                                            como miniatura en la pestaña del navegador -->
</head>
<body> <!-- Parte visible. Todo lo que coloquemos dentro de esta etiqueta se visualizará en el navegador -->
    
</body>
</html>
