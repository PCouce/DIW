<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ejemplo párrafos, saltos de línea y separadores</title>
</head>
<body>
    <h2>Párrafos, saltos y separadores</h2>
    <p>Los párrafos de texto se definen con la etiqueta &lt;p&gt;</p> <!-- Párrafo -->
    <p> Si queremos que el contenido se muestre de forma ideńtica a como <br> se preformatea en el fichero .html podemos usar la etiqueta &lt;pre&gt;</p>
    <hr>
    <pre>Este es un párrafo que se muestra con el texto preformateado</pre>
</body>
</html>
