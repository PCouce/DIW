<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo tabla</title>

    <style>
        table, th, td { border: 1px solid black}
    </style>
</head>
    <!-- Tabla sencilla-->


    <table>
        <thead>
            <tr>
                <th>Mes</th>
                <th>Ahorro</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>January</td>
                <td>100€</td>
            </tr>
            <tr>
                <td>Febrero</td>
                <td>80€</td>
            </tr>
            <tr>
                <td>Total</td>
                <td>180€</td>
            </tr>
        </tbody>

    </table>

    <br>

    <!-- Ejemplo de tabla con columna que ocupa más de una posición-->

    <table>
        <thead>
            <tr>
                <th colspan="2">Tabla Personas</th>
            </tr>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Pepe</td>
                <td>26</td>
            </tr>
            <tr>
                <td>Ana</td>
                <td>41</td>
            </tr>
        </tbody>
    </table>

    

<body>
    
</body>
</html>
